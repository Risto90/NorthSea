name: Ручной выпуск игры

on:
  workflow_dispatch:

concurrency:
  group: release-publish
  cancel-in-progress: false

env:
  GLOBAL_RELEASE: "0"

jobs:
  publish:
    name: Собрать и опубликовать релиз
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: write
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Проверить ветку выпуска
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            printf 'Релизы можно собирать только из main.\n' >&2
            exit 1
          fi
      - name: Настроить Rust для всех сборок
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,wasm32-unknown-unknown
      - name: Настроить пути Rust
        run: |
          echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$HOME/.rustup" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Рассчитать номер релиза
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(scripts/next-release-version.sh)"
          echo "base=$version" >> "$GITHUB_OUTPUT"
          echo "Будет собрана версия $version."
      - name: Рассчитать Android versionCode
        id: android-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_data="$(bash scripts/android-release-version.sh '${{ steps.version.outputs.base }}')"
          IFS=$'\t' read -r previous_tag previous_code android_version_code android_package_version baseline_code baseline_package_version previous_signer_sha256 \
            <<< "$version_data"
          test -n "$previous_code"
          test -n "$android_version_code"
          test -n "$android_package_version"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "previous_code=$previous_code" >> "$GITHUB_OUTPUT"
          echo "android_version_code=$android_version_code" >> "$GITHUB_OUTPUT"
          echo "android_package_version=$android_package_version" >> "$GITHUB_OUTPUT"
          echo "baseline_code=$baseline_code" >> "$GITHUB_OUTPUT"
          echo "baseline_package_version=$baseline_package_version" >> "$GITHUB_OUTPUT"
          echo "previous_signer_sha256=$previous_signer_sha256" >> "$GITHUB_OUTPUT"
          echo "Для релиза будет versionCode $android_version_code."
      - name: Установить Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Настроить Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Установить Android SDK и NDK
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Установить инструменты упаковки
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            rpm \
            libx11-dev \
            libvulkan-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgbm-dev \
            libvulkan1 \
            libegl1 \
            libgl1 \
            libgbm1 \
            mesa-vulkan-drivers \
            xvfb \
            xauth \
            cpio
          cargo install --locked cargo-apk
          cargo install --locked wasm-pack --version 0.13.1
      - name: Проверить Rust-код
        run: cargo test --locked
      - name: Проверить расчёт Android versionCode
        run: |
          scripts/with-rust-toolchain.sh rustc \
            --edition=2024 \
            --test scripts/android-release-version.rs \
            -o "$RUNNER_TEMP/android-release-version-tests"
          "$RUNNER_TEMP/android-release-version-tests"
      - name: Собрать Android APK
        id: android-signing
        env:
          ANDROID_PACKAGE_VERSION: ${{ steps.android-version.outputs.android_package_version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EXPECTED_ANDROID_SIGNER_SHA256: ${{ steps.android-version.outputs.previous_signer_sha256 }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            printf 'В GitHub Secrets не настроены ANDROID_KEYSTORE_BASE64 и ANDROID_KEYSTORE_PASSWORD.\n' >&2
            exit 1
          fi
          bash scripts/build-android-apk.sh
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          apk="$PWD/generated-artifacts/north-sea.apk"
          signed_apk="$RUNNER_TEMP/north-sea-signed.apk"
          "$apksigner" sign \
            --ks <(printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode) \
            --ks-key-alias androiddebugkey \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out "$signed_apk" \
            "$apk"
          mv -- "$signed_apk" "$apk"
          signing_certificate="$("$apksigner" verify --print-certs "$apk" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
            tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "${#signing_certificate}" -eq 64
          if [[ -n "$EXPECTED_ANDROID_SIGNER_SHA256" ]]; then
            test "$signing_certificate" = "$EXPECTED_ANDROID_SIGNER_SHA256"
          fi
          apk_badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging generated-artifacts/north-sea.apk)"
          apk_version_code="$(sed -n "s/^package:.*versionCode='\\([^']*\\)'.*/\\1/p" <<< "$apk_badging")"
          test "$apk_version_code" = "${{ steps.android-version.outputs.android_version_code }}"
          grep -Fq "application-label:'North Sea'" <<< "$apk_badging"
          grep -Eq "application: label='North Sea' icon='res/mipmap[^']*/ic_launcher\\.png'" <<< "$apk_badging"
          echo "certificate_sha256=$signing_certificate" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp generated-artifacts/north-sea.apk \
            "$RUNNER_TEMP/release-assets/north-sea-${{ steps.version.outputs.base }}-android.apk"
      - name: Собрать Linux DEB и RPM
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.base }}
        run: |
          bash scripts/build-linux-packages.sh
          deb="$(find generated-artifacts/linux -maxdepth 1 -name '*.deb' -print -quit)"
          rpm="$(find generated-artifacts/linux -maxdepth 1 -name '*.rpm' -print -quit)"
          test -n "$deb" && test -n "$rpm"
          test "$(dpkg-deb -f "$deb" Version)" = "$PACKAGE_VERSION"
          test "$(rpm -qp --qf '%{VERSION}' "$rpm")" = "$PACKAGE_VERSION"
          dpkg-deb --info "$deb"
          rpm -qp --info "$rpm"
          vulkan_icd="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          if [[ -z "$vulkan_icd" ]]; then
            printf 'Не найден программный Vulkan-драйвер для проверки пакетов.\n' >&2
            exit 1
          fi
          VK_ICD_FILENAMES="$vulkan_icd" \
            bash scripts/test-linux-package.sh "$deb" "$rpm" assets/icons/north-sea.png
          cp "$deb" "$RUNNER_TEMP/release-assets/north-sea-${{ steps.version.outputs.base }}-linux.deb"
          cp "$rpm" "$RUNNER_TEMP/release-assets/north-sea-${{ steps.version.outputs.base }}-linux.rpm"
      - name: Собрать WebAssembly для сайта
        env:
          RELEASE_BASE: ${{ steps.version.outputs.base }}
        run: |
          bash scripts/build-web.sh
          printf '{"version":"%s","type":"web"}\n' "$RELEASE_BASE" \
            > artifacts/north-seas-adventure/dist/public/release.json
          test "$(jq -r '.version' artifacts/north-seas-adventure/dist/public/release.json)" = "$RELEASE_BASE"
          test "$(jq -r '.type' artifacts/north-seas-adventure/dist/public/release.json)" = "web"
      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5
      - name: Подготовить сайт для GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/north-seas-adventure/dist/public
      - name: Опубликовать сайт на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Удалить временный архив Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_ids="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id')"
          while IFS= read -r artifact_id; do
            [[ -z "$artifact_id" ]] && continue
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" >/dev/null
          done <<< "$artifact_ids"
      - name: Опубликовать GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BASE: ${{ steps.version.outputs.base }}
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"
          cat > "$notes_file" <<EOF
          Версия релиза: \`$RELEASE_BASE\`
          Android versionCode: \`${{ steps.android-version.outputs.android_version_code }}\`
          Android signer SHA256: \`${{ steps.android-signing.outputs.certificate_sha256 }}\`

          Идентификаторы сборок:
          - \`$RELEASE_BASE-android\` — APK для Android.
          - \`$RELEASE_BASE-linux\` — пакеты DEB и RPM для Linux.
          EOF
          if [[ '${{ steps.android-version.outputs.previous_tag }}' == "0.1126.2.2" ]]; then
            cat >> "$notes_file" <<'EOF'

          Для перехода с прежних APK сначала удалите старую установку: она подписана другим временным ключом. Удаление может стереть локальные данные. Последующие версии будут обновляться с сохранением данных.
          EOF
          fi

          existing_state="$(gh release view "$RELEASE_BASE" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          case "$existing_state" in
            true)
              gh release upload "$RELEASE_BASE" "$RUNNER_TEMP/release-assets/"* --clobber
              gh release edit "$RELEASE_BASE" \
                --title "$RELEASE_BASE" \
                --notes-file "$notes_file" \
                --target "$GITHUB_SHA" \
                --draft=false \
                --latest
              ;;
            false)
              printf 'Релиз %s уже опубликован; новый номер должен быть рассчитан от него.\n' "$RELEASE_BASE" >&2
              exit 1
              ;;
            *)
              gh release create "$RELEASE_BASE" "$RUNNER_TEMP/release-assets/"* \
                --title "$RELEASE_BASE" \
                --notes-file "$notes_file" \
                --target "$GITHUB_SHA" \
                --latest
              ;;
          esac
