[package]
name = "north-seas-adventure"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tiny-skia-path = { version = "0.11.4", default-features = false }
usvg = { version = "0.45.1", default-features = false }

[[bin]]
name = "web-preview"
path = "src/web_preview.rs"

[package.metadata.android]
package = "com.northseas.adventure"
apk_name = "north-seas-adventure"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 36

[package.metadata.android.application]
label = "Моря Туманного Севера"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
label = "Моря Туманного Севера"
config_changes = "orientation|keyboardHidden|screenSize"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wgpu = { version = "30.0.2", default-features = false, features = ["webgpu", "wgsl"] }
web-sys = { version = "0.3", features = [
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "KeyboardEvent",
    "Navigator",
    "PointerEvent",
    "Storage",
    "WheelEvent",
    "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4.0"
wgpu = { version = "30.0.2", default-features = false, features = ["vulkan", "wgsl"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["native-activity"] }
ndk = { version = "0.9.0", features = ["rwh_06"] }
raw-window-handle = "0.6"
