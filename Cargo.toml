[package]
name = "north-sea"
version = "0.1.0"
edition = "2024"
publish = false
homepage = "https://risto90.github.io/NorthSea/"
repository = "https://github.com/Risto90/NorthSea"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
raw-window-handle = "0.6.2"
tiny-skia-path = { version = "0.11.4", default-features = false }
usvg = { version = "0.45.1", default-features = false }

[build-dependencies]
naga = { version = "30.0.2", default-features = false, features = ["wgsl-in", "spv-out"] }

[dev-dependencies]
naga = { version = "30.0.2", default-features = false, features = ["wgsl-in"] }

[[bin]]
name = "web-preview"
path = "src/web_preview.rs"

[package.metadata.android]
package = "com.northseas.adventure"
apk_name = "north-sea"
resources = "packaging/android/res"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 36

[package.metadata.android.application]
label = "North Sea"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
label = "North Sea"
config_changes = "orientation|keyboardHidden|screenSize"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wgpu = { version = "30.0.2", default-features = false, features = ["webgpu", "wgsl"] }
web-sys = { version = "0.3", features = [
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "KeyboardEvent",
    "Navigator",
    "PointerEvent",
    "Storage",
    "console",
    "WebGlBuffer",
    "WebGlProgram",
    "WebGlRenderingContext",
    "WebGlShader",
    "WebGlUniformLocation",
    "WheelEvent",
    "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4.0"
wgpu = { version = "30.0.2", default-features = false, features = ["gles", "vulkan", "wgsl"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
ash = "0.38.0"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["native-activity"] }
ndk = { version = "0.9.0", features = ["rwh_06"] }
